<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Chuva de Estrelas</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1026; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Estado
  let state = 'menu';            // menu | play | over
  let score = 0, lives = 5, best = 0;
  let items = [], particles = [];
  let px = W / 2, targetX = W / 2;
  let spawnT = 0, last = 0, overAt = 0, shake = 0;

  try { best = +localStorage.getItem('chuva_best') || 0; } catch (e) {}

  const bg = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.4 + 0.4, s: Math.random() * 18 + 6
  }));

  const playerW = () => Math.max(80, Math.min(W * 0.22, 130));
  const playerY = () => H - 100;

  function start() {
    score = 0; lives = 5; items = []; particles = [];
    spawnT = 0; px = targetX = W / 2; state = 'play';
  }

  function end() {
    state = 'over'; overAt = performance.now();
    if (score > best) {
      best = score;
      try { localStorage.setItem('chuva_best', String(best)); } catch (e) {}
    }
  }

  // Entrada (toque e mouse)
  function move(e) { targetX = e.clientX; }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); move(e);
    if (state === 'menu') start();
    else if (state === 'over' && performance.now() - overAt > 600) start();
  });
  cv.addEventListener('pointermove', e => { e.preventDefault(); move(e); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * 180 + 40;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, color });
    }
  }

  function spawn() {
    const bombChance = Math.min(0.32, 0.12 + score * 0.003);
    const r = 16 + Math.random() * 6;
    items.push({
      x: r + Math.random() * (W - r * 2), y: -30, r,
      bomb: Math.random() < bombChance,
      v: 0.85 + Math.random() * 0.3,
      rot: Math.random() * 6
    });
  }

  function update(dt) {
    const speed = Math.min(170 + score * 5, 560);
    const interval = Math.max(0.32, 0.9 - score * 0.012);

    px += (targetX - px) * Math.min(1, dt * 18);
    const half = playerW() / 2;
    px = Math.max(half, Math.min(W - half, px));

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = interval; }

    const py = playerY();
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += speed * it.v * dt;
      it.rot += dt * 2;

      const caught = it.y + it.r > py - 14 && it.y - it.r < py + 14 &&
                     Math.abs(it.x - px) < half + it.r * 0.6;
      if (caught) {
        if (it.bomb) {
          lives--; shake = 0.3;
          burst(it.x, it.y, '#ff5a4d', 18);
          if (navigator.vibrate) navigator.vibrate(80);
        } else {
          score++;
          burst(it.x, it.y, '#ffd84a', 10);
        }
        items.splice(i, 1);
        if (lives <= 0) { end(); return; }
      } else if (it.y - it.r > H) {
        if (!it.bomb) {            // deixar estrela cair custa uma vida
          lives--;
          if (lives <= 0) { items.splice(i, 1); end(); return; }
        }
        items.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) shake -= dt;
  }

  // Desenho
  function drawStar(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.45 : r;
      const a = rot + (i * Math.PI) / 5 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd84a'; ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 14;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  function drawBomb(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#22252e'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#ff5a4d'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + 6, y - r - 9);
    ctx.strokeStyle = '#c9a66b'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 6, y - r - 10, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9d2e'; ctx.fill();
  }

  function drawPlayer() {
    const w = playerW(), y = playerY(), x = px;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - 14);
    ctx.lineTo(x + w / 2, y - 14);
    ctx.lineTo(x + w / 2 - 14, y + 18);
    ctx.lineTo(x - w / 2 + 14, y + 18);
    ctx.closePath();
    ctx.fillStyle = '#4fd1c5'; ctx.shadowColor = '#4fd1c5'; ctx.shadowBlur = 16;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(x - w / 2 + 6, y - 14, w - 12, 5);
  }

  function text(str, x, y, size, color, align, weight) {
    ctx.font = `${weight || 700} ${size}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = align || 'center'; ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }

  function draw(now) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1026'); g.addColorStop(1, '#1d2a5b');
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);

    const t = now / 1000;
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (const s of bg) {
      const y = ((s.y * H + t * s.s) % H);
      ctx.beginPath(); ctx.arc(s.x * W, y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    if (state !== 'menu') {
      for (const it of items) it.bomb ? drawBomb(it.x, it.y, it.r) : drawStar(it.x, it.y, it.r, it.rot);
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
      drawPlayer();

      text('★ ' + score, 18, 44, 28, '#ffd84a', 'left');
      text('♥'.repeat(Math.max(0, lives)), W - 18, 44, 22, '#ff6b81', 'right');
    }

    if (state === 'menu') {
      text('Chuva de Estrelas', W / 2, H * 0.32, Math.min(44, W / 9), '#ffd84a');
      text('Arraste o dedo para mover a cesta', W / 2, H * 0.32 + 48, 17, '#cfd8ff', 'center', 400);
      text('Pegue as ★   Evite as bombas', W / 2, H * 0.32 + 76, 17, '#cfd8ff', 'center', 400);
      text('Toque para jogar', W / 2, H * 0.62, 24, '#fff');
      if (best) text('Recorde: ' + best, W / 2, H * 0.62 + 40, 18, '#4fd1c5');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(5,8,25,.65)'; ctx.fillRect(0, 0, W, H);
      text('Fim de jogo', W / 2, H * 0.34, Math.min(42, W / 9), '#ff6b81');
      text('Pontos: ' + score, W / 2, H * 0.34 + 50, 26);
      text('Recorde: ' + best, W / 2, H * 0.34 + 88, 20, '#4fd1c5');
      if (now - overAt > 600) text('Toque para jogar de novo', W / 2, H * 0.62, 22);
    }
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (state === 'play') update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
